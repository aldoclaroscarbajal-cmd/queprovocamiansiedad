<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro Anti-Ansiedad & Radar de Control</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Prop-Types library required by Recharts in UMD mode -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  
  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Recharts for Radar Chart -->
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
  
  <!-- Custom Fonts & Smooth Animations -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      35% { transform: scale(1.35); opacity: 1; }
      65% { transform: scale(1.35); opacity: 1; }
    }
    .animate-breathe {
      animation: breathe 19s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased p-2 sm:p-4 md:p-6 w-full h-auto min-h-screen">

  <div id="root" class="max-w-5xl mx-auto"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar, ResponsiveContainer, Tooltip } = window.Recharts || {};

    const CustomRadarChart = ({ data }) => {
      const [hoveredIndex, setHoveredIndex] = useState(null);
      const size = 320;
      const center = size / 2;
      const radius = 105;
      const total = data.length;

      const getCoords = (index, value) => {
        const angle = (Math.PI * 2 / total) * index - Math.PI / 2;
        const r = (value / 10) * radius;
        return {
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle)
        };
      };

      const pointsString = data.map((d, i) => {
        const { x, y } = getCoords(i, d.level);
        return `${x},${y}`;
      }).join(' ');

      return (
        <div className="relative w-full h-full flex flex-col items-center justify-center">
          <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full max-w-[320px] max-h-[320px] overflow-visible">
            {[2, 4, 6, 8, 10].map(val => {
              const pts = data.map((_, i) => {
                const { x, y } = getCoords(i, val);
                return `${x},${y}`;
              }).join(' ');
              return (
                <polygon
                  key={val}
                  points={pts}
                  fill="none"
                  stroke="#e2e8f0"
                  strokeDasharray={val === 10 ? "none" : "3,3"}
                  strokeWidth="1"
                />
              );
            })}

            {data.map((_, i) => {
              const { x, y } = getCoords(i, 10);
              return <line key={i} x1={center} y1={center} x2={x} y2={y} stroke="#cbd5e1" strokeWidth="1" />;
            })}

            <polygon
              points={pointsString}
              fill="rgba(99, 102, 241, 0.35)"
              stroke="#6366f1"
              strokeWidth="2.5"
              className="transition-all duration-300"
            />

            {data.map((d, i) => {
              const { x, y } = getCoords(i, d.level);
              const labelPos = getCoords(i, 12.2);
              const isHovered = hoveredIndex === i;

              return (
                <g key={d.id}>
                  <circle
                    cx={x}
                    cy={y}
                    r={isHovered ? 7 : 5}
                    fill={d.level >= 7 ? "#f43f5e" : d.level >= 5 ? "#f59e0b" : "#10b981"}
                    stroke="#ffffff"
                    strokeWidth="2"
                    className="cursor-pointer transition-all duration-200"
                    onMouseEnter={() => setHoveredIndex(i)}
                    onMouseLeave={() => setHoveredIndex(null)}
                  />
                  <text
                    x={labelPos.x}
                    y={labelPos.y}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    className="text-[10px] font-semibold fill-slate-600 select-none"
                  >
                    {d.name.split('/')[0]}
                  </text>
                </g>
              );
            })}
          </svg>

          {hoveredIndex !== null && (
            <div className="absolute top-2 bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg shadow-md pointer-events-none z-10">
              <span className="font-bold">{data[hoveredIndex].name}: </span>
              <span className="text-indigo-300 font-semibold">{data[hoveredIndex].level}/10</span>
            </div>
          )}
        </div>
      );
    };

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        radar: <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M12 12m-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0M12 3v18M3 12h18" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        brain: <path d="M9.5 2A2.5 2.5 0 0 0 7 4.5M14.5 2A2.5 2.5 0 0 1 17 4.5M12 12v9M12 12l-4-3M12 12l4-3M4 10a4 4 0 0 0 4 4M20 10a4 4 0 0 1-4 4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"/>,
        matrix: <path d="M4 4h16v16H4z M4 10h16 M10 4v16" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"/>,
        check: <path d="M20 6L9 17l-5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        wind: <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        plus: <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"/>,
        trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"/>,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        arrowRight: <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        refresh: <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        alert: <path d="M12 8v4M12 16h.01M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10z" stroke="currentColor" strokeWidth="2" fill="none"/>,
        sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
        clock: <path d="M12 6v6l4 2M22 12A10 10 0 1 1 2 12a10 10 0 0 1 20 0z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" fill="none"/>
      };
      return <svg className={className} viewBox="0 0 24 24">{icons[name] || icons.brain}</svg>;
    };

    const INITIAL_AREAS = [
      { id: 'trabajo', name: 'Trabajo / Carrera', level: 7 },
      { id: 'dinero', name: 'Dinero / Finanzas', level: 6 },
      { id: 'relaciones', name: 'Pareja / Relaciones', level: 5 },
      { id: 'salud', name: 'Salud Física', level: 4 },
      { id: 'sueno', name: 'Sueño / Descanso', level: 8 },
      { id: 'soledad', name: 'Soledad / Apoyo', level: 3 },
      { id: 'noticias', name: 'Noticias / Redes', level: 7 },
      { id: 'social', name: 'Entorno Social', level: 4 }
    ];

    const DISTORTIONS = [
      { id: 'catastrofe', name: 'Catastrofización', desc: 'Asumir el peor escenario posible sin pruebas duras.' },
      { id: 'mente', name: 'Lectura de Mente', desc: 'Creer saber lo que los demás piensan de ti o sus intenciones.' },
      { id: 'todonada', name: 'Pensamiento Todo o Nada', desc: 'Si no sale perfecto, lo consideras un fracaso absoluto.' },
      { id: 'filtro', name: 'Filtro Negativo', desc: 'Enfocarse solo en un detalle malo e ignorar todo lo positivo.' },
      { id: 'control', name: 'Ilusión de Control', desc: 'Hacerte responsable de cosas que dependen de terceros.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('radar');
      
      // Persisted State - Radar Levels
      const [radarData, setRadarData] = useState(() => {
        const saved = localStorage.getItem('app_anxiety_radar');
        return saved ? JSON.parse(saved) : INITIAL_AREAS;
      });

      // Persisted State - Deconstructed Items
      const [matrixItems, setMatrixItems] = useState(() => {
        const saved = localStorage.getItem('app_anxiety_matrix');
        return saved ? JSON.parse(saved) : [
          {
            id: '1',
            area: 'Trabajo / Carrera',
            thought: 'Siento que no terminaré el proyecto y perderé el respeto de mi equipo.',
            controlScore: 8,
            distortion: 'Catastrofización',
            action: 'Definir solo las 2 tareas críticas de hoy y pedir feedback de avance.',
            createdAt: new Date().toLocaleDateString('es-ES')
          }
        ];
      });

      // Persisted State - Micro-habits
      const [habits, setHabits] = useState(() => {
        const saved = localStorage.getItem('app_anxiety_habits');
        return saved ? JSON.parse(saved) : [
          { id: 'h1', text: '5 min de respiración antes de ver el celular', completed: false, streak: 3 },
          { id: 'h2', text: 'Escribir 1 micro-acción de control diaria', completed: true, streak: 5 }
        ];
      });

      // Form State for Matrix
      const [formArea, setFormArea] = useState(INITIAL_AREAS[0].name);
      const [formThought, setFormThought] = useState('');
      const [formControl, setFormControl] = useState(5);
      const [formDistortion, setFormDistortion] = useState(DISTORTIONS[0].name);
      const [formAction, setFormAction] = useState('');

      // Breathing Timer State
      const [breathingActive, setBreathingActive] = useState(false);
      const [breathPhase, setBreathPhase] = useState('Inhala (4s)');
      const [breathCounter, setBreathCounter] = useState(0);

      useEffect(() => {
        localStorage.setItem('app_anxiety_radar', JSON.stringify(radarData));
      }, [radarData]);

      useEffect(() => {
        localStorage.setItem('app_anxiety_matrix', JSON.stringify(matrixItems));
      }, [matrixItems]);

      useEffect(() => {
        localStorage.setItem('app_anxiety_habits', JSON.stringify(habits));
      }, [habits]);

      useEffect(() => {
        let timer;
        if (breathingActive) {
          const phases = [
            { name: 'Inhala profundamente...', duration: 4000 },
            { name: 'Sostén el aire (Calmando el sistema nervioso)...', duration: 7000 },
            { name: 'Exhala suavemente por la boca...', duration: 8000 }
          ];
          let currentIdx = 0;

          const runPhase = () => {
            setBreathPhase(phases[currentIdx].name);
            timer = setTimeout(() => {
              if (currentIdx === 2) {
                setBreathCounter(prev => prev + 1);
              }
              currentIdx = (currentIdx + 1) % phases.length;
              if (breathingActive) runPhase();
            }, phases[currentIdx].duration);
          };

          runPhase();
        } else {
          setBreathPhase('Listo para comenzar');
        }
        return () => clearTimeout(timer);
      }, [breathingActive]);

      // Calculations
      const highestAnxietyArea = useMemo(() => {
        return [...radarData].sort((a, b) => b.level - a.level)[0];
      }, [radarData]);

      const globalAnxietyScore = useMemo(() => {
        const sum = radarData.reduce((acc, curr) => acc + curr.level, 0);
        return Math.round((sum / (radarData.length * 10)) * 100);
      }, [radarData]);

      const handleSliderChange = (id, newLevel) => {
        setRadarData(prev => prev.map(item => item.id === id ? { ...item, level: Number(newLevel) } : item));
      };

      const handleAddMatrixItem = (e) => {
        e.preventDefault();
        if (!formThought.trim() || !formAction.trim()) return;

        const newItem = {
          id: Date.now().toString(),
          area: formArea,
          thought: formThought,
          controlScore: Number(formControl),
          distortion: formDistortion,
          action: formAction,
          createdAt: new Date().toLocaleDateString('es-ES')
        };

        setMatrixItems([newItem, ...matrixItems]);

        // Auto add action as micro-habit
        setHabits(prev => [
          { id: 'h_' + Date.now(), text: `[${formArea}] ${formAction}`, completed: false, streak: 1 },
          ...prev
        ]);

        // Reset form
        setFormThought('');
        setFormAction('');
        setFormControl(5);
        setActiveTab('matrix');
      };

      const handleQuickDeconstruct = (areaName) => {
        setFormArea(areaName);
        setActiveTab('matrix');
      };

      const handleDeleteMatrixItem = (id) => {
        setMatrixItems(prev => prev.filter(item => item.id !== id));
      };

      const handleToggleHabit = (id) => {
        setHabits(prev => prev.map(h => {
          if (h.id === id) {
            const nextCompleted = !h.completed;
            return {
              ...h,
              completed: nextCompleted,
              streak: nextCompleted ? h.streak + 1 : Math.max(0, h.streak - 1)
            };
          }
          return h;
        }));
      };

      const handleAddHabitDirect = (text) => {
        if (!text || !text.trim()) return;
        setHabits(prev => [{ id: 'h_' + Date.now(), text, completed: false, streak: 1 }, ...prev]);
      };

      return (
        <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden w-full transition-all">
          
          {/* Header */}
          <header class="bg-slate-900 text-white p-6 sm:p-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-2 text-emerald-400 font-semibold text-xs tracking-wider uppercase mb-1">
                  <Icon name="sparkles" class="w-4 h-4" />
                  <span>Oferta Viva &bull; Salud Mental Táctica</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold">Brújula y Matriz Anti-Ansiedad</h1>
                <p class="text-slate-400 text-sm mt-1">Transforma la sobrecarga mental en claridad ejecutiva y hábitos de control.</p>
              </div>

              {/* Status Badge */}
              <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex items-center gap-4 self-start md:self-auto">
                <div>
                  <p class="text-xs text-slate-400">Nivel de Sobrecarga</p>
                  <p class={`text-lg font-bold ${globalAnxietyScore > 65 ? 'text-rose-400' : globalAnxietyScore > 40 ? 'text-amber-400' : 'text-emerald-400'}`}>
                    {globalAnxietyScore}%
                  </p>
                </div>
                <div class="h-8 w-px bg-slate-700"></div>
                <div>
                  <p class="text-xs text-slate-400">Foco Prioritario</p>
                  <p class="text-xs font-semibold text-white truncate max-w-[120px]">
                    {highestAnxietyArea ? highestAnxietyArea.name : 'N/A'}
                  </p>
                </div>
              </div>
            </div>

            {}
            <nav class="flex flex-wrap gap-2 mt-6 pt-4 border-t border-slate-800 text-sm font-medium">
              <button
                onClick={() => setActiveTab('radar')}
                class={`flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all ${
                  activeTab === 'radar' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800'
                }`}
              >
                <Icon name="radar" class="w-4 h-4" />
                <span>1. Radar de Ansiedad</span>
              </button>

              <button
                onClick={() => setActiveTab('matrix')}
                class={`flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all ${
                  activeTab === 'matrix' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800'
                }`}
              >
                <Icon name="matrix" class="w-4 h-4" />
                <span>2. Matriz de Control</span>
              </button>

              <button
                onClick={() => setActiveTab('habits')}
                class={`flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all ${
                  activeTab === 'habits' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800'
                }`}
              >
                <Icon name="check" class="w-4 h-4" />
                <span>3. Micro-Hábitos ({habits.filter(h => h.completed).length}/{habits.length})</span>
              </button>

              <button
                onClick={() => setActiveTab('breathe')}
                class={`flex items-center gap-2 px-4 py-2.5 rounded-xl transition-all ${
                  activeTab === 'breathe' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800'
                }`}
              >
                <Icon name="wind" class="w-4 h-4" />
                <span>4. Calma Táctica (4-7-8)</span>
              </button>
            </nav>
          </header>

          {/* Body Content Areas */}
          <main class="p-4 sm:p-6 md:p-8">

            {}
            {activeTab === 'radar' && (
              <div class="space-y-6">
                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-600 text-white rounded-lg">
                      <Icon name="brain" class="w-5 h-5" />
                    </div>
                    <div>
                      <h2 class="font-semibold text-slate-900">Diagnóstico del Efecto Dominó</h2>
                      <p class="text-xs text-slate-600">Ajusta las barras según tu sensación interna hoy (1 = Calma / 10 = Pánico).</p>
                    </div>
                  </div>
                  {highestAnxietyArea && (
                    <button
                      onClick={() => handleQuickDeconstruct(highestAnxietyArea.name)}
                      class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl text-xs font-semibold flex items-center gap-2 transition-all shadow-sm w-full sm:w-auto justify-center"
                    >
                      <span>Descomprimir detonante mayor ({highestAnxietyArea.name})</span>
                      <Icon name="arrowRight" class="w-4 h-4" />
                    </button>
                  )}
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                  
                  {/* Radar Chart Container */}
                  <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 h-[320px] sm:h-[380px] flex flex-col items-center justify-center">
                    <p class="text-xs font-semibold text-slate-500 mb-2">MAPA RADIOGRÁFICO DE TENSIÓN</p>
                    {ResponsiveContainer && RadarChart ? (
                      <ResponsiveContainer width="100%" height="90%">
                        <RadarChart data={radarData}>
                          <PolarGrid stroke="#cbd5e1" />
                          <PolarAngleAxis dataKey="name" tick={{ fill: '#475569', fontSize: 11 }} />
                          <PolarRadiusAxis angle={30} domain={[0, 10]} stroke="#94a3b8" />
                          <Radar name="Ansiedad" dataKey="level" stroke="#6366f1" fill="#818cf8" fillOpacity={0.5} />
                          <Tooltip formatter={(value) => [`${value}/10`, 'Nivel de Tensión']} />
                        </RadarChart>
                      </ResponsiveContainer>
                    ) : (
                      <CustomRadarChart data={radarData} />
                    )}
                  </div>

                  {/* Sliders Input Control */}
                  <div class="space-y-3 bg-white p-4 border border-slate-200 rounded-xl">
                    <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-2">Evaluación por Áreas</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {radarData.map((item) => (
                        <div key={item.id} class="p-2.5 bg-slate-50 rounded-lg border border-slate-100">
                          <div class="flex justify-between items-center text-xs mb-1 font-medium">
                            <span class="text-slate-700">{item.name}</span>
                            <span class={`font-bold px-2 py-0.5 rounded ${
                              item.level >= 7 ? 'bg-rose-100 text-rose-700' :
                              item.level >= 5 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'
                            }`}>
                              {item.level}/10
                            </span>
                          </div>
                          <input
                            type="range"
                            min="1"
                            max="10"
                            value={item.level}
                            onChange={(e) => handleSliderChange(item.id, e.target.value)}
                            class="w-full accent-indigo-600 cursor-pointer h-1.5 bg-slate-200 rounded-lg"
                          />
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            )}

            {}
            {activeTab === 'matrix' && (
              <div class="space-y-8">
                
                {/* Form to Deconstruct Anxiety */}
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm space-y-4">
                  <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                    <Icon name="matrix" class="w-5 h-5 text-indigo-600" />
                    <h2 class="font-bold text-slate-800 text-lg">Deconstructor de Pensamientos Catastróficos</h2>
                  </div>

                  <form onSubmit={handleAddMatrixItem} class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      
                      {/* Area Selection */}
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">1. Fuente de Tensión</label>
                        <select
                          value={formArea}
                          onChange={(e) => setFormArea(e.target.value)}
                          class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        >
                          {radarData.map(a => (
                            <option key={a.id} value={a.name}>{a.name} (Estrés actual: {a.level}/10)</option>
                          ))}
                        </select>
                      </div>

                      {/* Distortion Selection */}
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">2. Distorsión Cognitiva Identificada</label>
                        <select
                          value={formDistortion}
                          onChange={(e) => setFormDistortion(e.target.value)}
                          class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        >
                          {DISTORTIONS.map(d => (
                            <option key={d.id} value={d.name}>{d.name} — ({d.desc})</option>
                          ))}
                        </select>
                      </div>

                    </div>

                    {/* Thought Input */}
                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1">3. ¿Cuál es el pensamiento exacto o temor abstracto?</label>
                      <input
                        type="text"
                        placeholder="Ej: Siento que en la reunión de mañana todo saldrá mal y quedaré en evidencia..."
                        value={formThought}
                        onChange={(e) => setFormThought(e.target.value)}
                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        required
                      />
                    </div>

                    {/* Controlability Slider & Action Input */}
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                      
                      <div class="space-y-1">
                        <label class="block text-xs font-bold text-slate-700">4. ¿Cuánto control real tienes? ({formControl}/10)</label>
                        <input
                          type="range"
                          min="1"
                          max="10"
                          value={formControl}
                          onChange={(e) => setFormControl(e.target.value)}
                          class="w-full accent-indigo-600 cursor-pointer"
                        />
                        <p class="text-[11px] text-slate-500 font-medium">
                          {formControl <= 3 ? '🔴 Fuera de tu control (Liberar)' : formControl <= 6 ? '🟡 Influenciable (Poner límites)' : '🟢 Bajo tu control (Accionar)'}
                        </p>
                      </div>

                      <div class="md:col-span-2 space-y-1">
                        <label class="block text-xs font-bold text-slate-700">5. ÚNICA Micro-Acción de 5 minutos para hoy</label>
                        <div class="flex gap-2">
                          <input
                            type="text"
                            placeholder="Ej: Escribir los 3 puntos principales en una nota..."
                            value={formAction}
                            onChange={(e) => setFormAction(e.target.value)}
                            class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            required
                          />
                          <button
                            type="submit"
                            class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold rounded-xl text-xs flex items-center gap-1.5 whitespace-nowrap shadow-sm transition-all"
                          >
                            <Icon name="plus" class="w-4 h-4" />
                            <span>Procesar</span>
                          </button>
                        </div>
                      </div>

                    </div>
                  </form>
                </div>

                {/* List of Processed Items */}
                <div class="space-y-4">
                  <h3 class="font-bold text-slate-800 text-md flex items-center gap-2">
                    <Icon name="shield" class="w-5 h-5 text-indigo-600" />
                    <span>Matriz de Registro & Clasificación ({matrixItems.length})</span>
                  </h3>

                  {matrixItems.length === 0 ? (
                    <div class="p-8 text-center bg-slate-50 border border-dashed border-slate-200 rounded-xl text-slate-500 text-sm">
                      No has procesado pensamientos todavía. Usa el formulario superior para deconstruir tu primer detonante.
                    </div>
                  ) : (
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {matrixItems.map((item) => (
                        <div key={item.id} class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3 relative hover:border-slate-300 transition-all">
                          <div class="flex items-start justify-between gap-2">
                            <div>
                              <span class="text-[11px] font-bold px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md uppercase">
                                {item.area}
                              </span>
                              <span class="text-[11px] text-slate-400 ml-2">{item.createdAt}</span>
                            </div>
                            <button
                              onClick={() => handleDeleteMatrixItem(item.id)}
                              class="text-slate-400 hover:text-rose-600 p-1 rounded-lg transition-colors"
                              title="Eliminar"
                            >
                              <Icon name="trash" class="w-4 h-4" />
                            </button>
                          </div>

                          <p class="text-sm text-slate-800 font-medium italic">"{item.thought}"</p>

                          <div class="flex items-center gap-2 text-xs text-slate-600">
                            <span class="font-semibold text-slate-700">Distorsión:</span>
                            <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium">{item.distortion}</span>
                          </div>

                          <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-1">
                            <div class="flex justify-between items-center text-xs">
                              <span class="font-bold text-slate-700">Micro-Acción táctica:</span>
                              <span class={`font-bold ${item.controlScore >= 7 ? 'text-emerald-600' : 'text-amber-600'}`}>
                                Control: {item.controlScore}/10
                              </span>
                            </div>
                            <p class="text-xs text-slate-800 font-semibold">{item.action}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {}
            {activeTab === 'habits' && (
              <div class="space-y-6 max-w-2xl mx-auto">
                <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 flex items-center justify-between">
                  <div>
                    <h2 class="font-bold text-slate-900 text-md">Seguimiento de Hábitos Anti-Ansiedad</h2>
                    <p class="text-xs text-slate-600">Las micro-acciones de la Matriz se guardan automáticamente aquí.</p>
                  </div>
                  <div class="text-right">
                    <p class="text-xs text-slate-500">Progreso Hoy</p>
                    <p class="text-xl font-bold text-emerald-600">
                      {habits.length > 0 ? Math.round((habits.filter(h => h.completed).length / habits.length) * 100) : 0}%
                    </p>
                  </div>
                </div>

                {/* Add Quick Habit */}
                <div class="flex gap-2">
                  <input
                    type="text"
                    id="newHabitInput"
                    placeholder="Agregar micro-hábito personalizado..."
                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        handleAddHabitDirect(e.target.value);
                        e.target.value = '';
                      }
                    }}
                  />
                  <button
                    onClick={() => {
                      const input = document.getElementById('newHabitInput');
                      if (input) {
                        handleAddHabitDirect(input.value);
                        input.value = '';
                      }
                    }}
                    class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold flex items-center gap-1 transition-all"
                  >
                    <Icon name="plus" class="w-4 h-4" />
                    <span>Agregar</span>
                  </button>
                </div>

                {/* Habit List */}
                <div class="space-y-3">
                  {habits.map((habit) => (
                    <div
                      key={habit.id}
                      onClick={() => handleToggleHabit(habit.id)}
                      class={`p-4 rounded-xl border cursor-pointer transition-all flex items-center justify-between ${
                        habit.completed ? 'bg-emerald-50/50 border-emerald-200 text-slate-700' : 'bg-white border-slate-200 hover:border-slate-300'
                      }`}
                    >
                      <div class="flex items-center gap-3">
                        <div class={`w-6 h-6 rounded-lg flex items-center justify-center transition-all ${
                          habit.completed ? 'bg-emerald-600 text-white' : 'border border-slate-300 bg-slate-50'
                        }`}>
                          {habit.completed && <Icon name="check" class="w-4 h-4" />}
                        </div>
                        <span class={`text-sm font-medium ${habit.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                          {habit.text}
                        </span>
                      </div>

                      <div class="flex items-center gap-2">
                        <span class="text-xs bg-amber-50 text-amber-700 border border-amber-200 font-bold px-2 py-0.5 rounded-md flex items-center gap-1">
                          🔥 {habit.streak} días
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {}
            {activeTab === 'breathe' && (
              <div class="max-w-xl mx-auto text-center space-y-6 py-4">
                <div>
                  <h2 class="text-xl font-bold text-slate-900">Protocolo Biológico de Calma (4-7-8)</h2>
                  <p class="text-xs text-slate-600 mt-1">Estimula directamente el nervio vago para desactivar la respuesta de lucha o huida.</p>
                </div>

                {/* Breathing Visual Sphere */}
                <div class="relative w-64 h-64 mx-auto flex items-center justify-center">
                  <div class={`absolute inset-0 bg-indigo-500/20 rounded-full transition-all duration-1000 ${breathingActive ? 'animate-breathe' : ''}`}></div>
                  <div class="relative z-10 w-44 h-44 bg-indigo-600 text-white rounded-full flex flex-col items-center justify-center p-4 shadow-xl">
                    <Icon name="wind" class="w-8 h-8 mb-2 animate-pulse" />
                    <p class="text-xs font-semibold text-center leading-snug px-2">{breathPhase}</p>
                  </div>
                </div>

                <div class="space-y-3">
                  <p class="text-xs font-semibold text-slate-500">Ciclos completados: <span class="text-indigo-600 font-bold text-sm">{breathCounter}</span></p>

                  <button
                    onClick={() => setBreathingActive(!breathingActive)}
                    class={`px-6 py-3 rounded-xl font-bold text-sm shadow-md transition-all active:scale-95 ${
                      breathingActive ? 'bg-rose-600 hover:bg-rose-700 text-white' : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                    }`}
                  >
                    {breathingActive ? 'Detener Ejercicio' : 'Iniciar Respiración 4-7-8'}
                  </button>
                </div>

                <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-600 text-left space-y-1">
                  <p class="font-bold text-slate-800">¿Cómo funciona el protocolo?</p>
                  <p>1. **Inhala** por la nariz silenciosamente durante 4 segundos.</p>
                  <p>2. **Sostén** la respiración durante 7 segundos.</p>
                  <p>3. **Exhala** ruidosamente por la boca durante 8 segundos.</p>
                </div>
              </div>
            )}

          </main>

          {}
          <footer class="bg-slate-50 border-t border-slate-200 p-4 text-center text-xs text-slate-500">
            <p>Tus datos permanecen 100% privados y guardados de forma local en tu navegador.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
